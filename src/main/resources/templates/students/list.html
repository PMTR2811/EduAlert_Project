<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sinh Viên - EduAlert</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Hệ thống EduAlert - Quản lý Sinh viên</h2>
        <a th:href="@{/students/new}" class="btn btn-primary">+ Thêm sinh viên</a>
    </div>

    <!-- Thanh tìm kiếm & Lọc trạng thái -->
    <form th:action="@{/students}" method="get" class="row g-3 mb-4">
        <div class="col-md-5">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên hoặc MSSV...">
        </div>
        <div class="col-md-4">
            <select name="status" class="form-select">
                <option value="">-- Tất cả trạng thái --</option>
                <option value="Normal" th:selected="${currentStatus == 'Normal'}">Bình thường (Normal)</option>
                <option value="Warning_L1" th:selected="${currentStatus == 'Warning_L1'}">Cảnh báo Mức 1 (Warning_L1)</option>
                <option value="Warning_L2" th:selected="${currentStatus == 'Warning_L2'}">Cảnh báo Mức 2 (Warning_L2)</option>
                <option value="Drop-out" th:selected="${currentStatus == 'Drop-out'}">Buộc thôi học (Drop-out)</option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-secondary w-100">Lọc dữ liệu</button>
        </div>
    </form>

    <!-- Bảng hiển thị danh sách -->
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>MSSV</th>
                <th>Họ và Tên</th>
                <th>Ngành</th>
                <th>Khóa</th>
                <th>Trạng thái (TT08)</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="6" class="text-center text-muted py-3">Chưa có dữ liệu sinh viên nào.</td>
            </tr>
            <tr th:each="std : ${students}">
                <td th:text="${std.studentCode}" class="fw-bold"></td>
                <td th:text="${std.fullName}"></td>
                <td th:text="${std.major}"></td>
                <td th:text="${std.cohort}"></td>
                <td>
                    <span th:if="${std.status == 'Normal'}" class="badge bg-success">Bình thường</span>
                    <span th:if="${std.status == 'Warning_L1'}" class="badge bg-warning text-dark">Cảnh báo Mức 1</span>
                    <span th:if="${std.status == 'Warning_L2'}" class="badge bg-danger">Cảnh báo Mức 2</span>
                    <span th:if="${std.status == 'Drop-out'}" class="badge bg-dark">Buộc thôi học</span>
                </td>
                <td>
                    <a th:href="@{/students/detail/{id}(id=${std.studentCode})}" class="btn btn-sm btn-info text-white">Chi tiết</a>
                    <a th:href="@{/students/edit/{id}(id=${std.studentCode})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                    <a th:href="@{/students/delete/{id}(id=${std.studentCode})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn có chắc muốn xóa sinh viên này?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
