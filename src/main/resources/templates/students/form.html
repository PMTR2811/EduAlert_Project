<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4" style="max-width: 600px;">
    <h3 class="mb-4 text-center">Thông tin Sinh Viên</h3>
    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <div class="mb-3">
            <label class="form-label">Mã số sinh viên (MSSV):</label>
            <input type="text" th:field="*{studentCode}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Họ và Tên:</label>
            <input type="text" th:field="*{fullName}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày sinh:</label>
            <input type="date" th:field="*{dob}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Giới tính:</label>
            <select th:field="*{gender}" class="form-select">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Ngành học:</label>
            <input type="text" th:field="*{major}" class="form-control" placeholder="CNTT, KTPM...">
        </div>
        <div class="mb-3">
            <label class="form-label">Khóa:</label>
            <input type="text" th:field="*{cohort}" class="form-control" placeholder="K21, K22...">
        </div>
        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/students}" class="btn btn-outline-secondary">Quay lại</a>
            <button type="submit" class="btn btn-primary">Lưu thông tin</button>
        </div>
    </form>
</body>
</html>
