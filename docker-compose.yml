services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edualert-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EduAlert@2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - edualert_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edualert-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database/tables_schema.sql:/init/tables_schema.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "EduAlert@2026", "-C", "-i", "/init/tables_schema.sql"]
    restart: "no"

  app:
    build: .
    image: edualert-app
    container_name: edualert-app
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=edualert;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "EduAlert@2026"
    ports:
      - "8080:8080"

volumes:
  edualert_data: