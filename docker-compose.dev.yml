services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edualert-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EduAlert@2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - edualert_sqldata:/var/opt/mssql

volumes:
  edualert_sqldata: